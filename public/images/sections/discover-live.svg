<svg width="437" height="195" viewBox="0 0 437 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="yesDigitClip"><rect x="106" y="82" width="20" height="28" rx="2"/></clipPath>
    <clipPath id="noDigitClip"><rect x="311" y="82" width="20" height="28" rx="2"/></clipPath>
    <clipPath id="chartClip"><rect x="22" y="90" width="393" height="72" rx="10"/></clipPath>
    <linearGradient id="yesBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#82FF53" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#B8FF9E" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      :root{--ease:cubic-bezier(.16,1,.3,1);--soft:cubic-bezier(.4,0,.2,1)}
      text{font-family:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-kerning:normal;font-variant-numeric:tabular-nums}
      .liveDot{transform-box:fill-box;transform-origin:center;animation:livePulse 6s ease-in-out infinite}
      .sceneStats{transform-box:fill-box;transform-origin:center;animation:statsScene 6s var(--ease) infinite}
      .sceneChart{transform-box:fill-box;transform-origin:center;animation:chartScene 6s var(--ease) infinite}
      .yesUnitStack{animation:yesRoll 6s var(--ease) infinite}
      .noUnitStack{animation:noRoll 6s var(--ease) infinite}
      .yesBarFill{transform-origin:left center;transform-box:fill-box;animation:yesBarGrow 6s var(--ease) infinite}
      .noBarFill{transform-origin:left center;transform-box:fill-box;animation:noBarShrink 6s var(--ease) infinite}
      .yesDelta{animation:yesDelta 6s var(--ease) infinite}
      .noDelta{animation:noDelta 6s var(--ease) infinite}
      .yesCard{animation:yesCard 6s var(--ease) infinite;transform-box:fill-box;transform-origin:center}
      .chartLine{stroke-dasharray:470;stroke-dashoffset:470;animation:drawChart 6s var(--ease) infinite}
      .chartArea{opacity:0;animation:areaIn 6s var(--ease) infinite}
      .endDot{animation:endDot 6s var(--ease) infinite;transform-box:fill-box;transform-origin:center}
      .tickerChip{animation:tickerIn 6s var(--ease) infinite;transform-box:fill-box;transform-origin:center}
      @keyframes livePulse{0%,100%{opacity:.95;transform:scale(1)}8%{opacity:.45;transform:scale(.72)}16%{opacity:1;transform:scale(1)}40%{opacity:.95}46%{opacity:.45;transform:scale(.72)}54%{opacity:1;transform:scale(1)}82%{opacity:.95}88%{opacity:.45;transform:scale(.72)}94%{opacity:1;transform:scale(1)}}
      @keyframes statsScene{0%,44%{opacity:1;transform:translateY(0) scale(1)}52%{opacity:0;transform:translateY(-8px) scale(.985)}92%{opacity:0;transform:translateY(7px) scale(.985)}100%{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes chartScene{0%,46%{opacity:0;transform:translateY(9px) scale(.985)}56%,88%{opacity:1;transform:translateY(0) scale(1)}94%,100%{opacity:0;transform:translateY(-5px) scale(.992)}}
      /* Units roll 1→2→3 and 9→8→7. Each row is 28px high. */
      @keyframes yesRoll{0%,15%{transform:translateY(0)}23%,29%{transform:translateY(-28px)}37%,91%{transform:translateY(-56px)}100%{transform:translateY(0)}}
      @keyframes noRoll{0%,15%{transform:translateY(0)}23%,29%{transform:translateY(-28px)}37%,91%{transform:translateY(-56px)}100%{transform:translateY(0)}}
      @keyframes yesBarGrow{0%,15%{transform:scaleX(.61)}23%,29%{transform:scaleX(.62)}37%,91%{transform:scaleX(.63)}100%{transform:scaleX(.61)}}
      @keyframes noBarShrink{0%,15%{transform:scaleX(.39)}23%,29%{transform:scaleX(.38)}37%,91%{transform:scaleX(.37)}100%{transform:scaleX(.39)}}
      @keyframes yesDelta{0%,15%{opacity:.45;transform:translateY(0)}22%{opacity:1;transform:translateY(-2px)}29%{opacity:.55;transform:translateY(0)}36%{opacity:1;transform:translateY(-2px)}44%,100%{opacity:.8;transform:translateY(0)}}
      @keyframes noDelta{0%,15%{opacity:.45;transform:translateY(0)}22%{opacity:1;transform:translateY(2px)}29%{opacity:.55;transform:translateY(0)}36%{opacity:1;transform:translateY(2px)}44%,100%{opacity:.75;transform:translateY(0)}}
      @keyframes yesCard{0%,34%{filter:none;transform:scale(1)}39%{filter:url(#softGlow);transform:scale(1.015)}44%,100%{filter:none;transform:scale(1)}}
      @keyframes drawChart{0%,55%{stroke-dashoffset:470}78%,91%{stroke-dashoffset:0}100%{stroke-dashoffset:470}}
      @keyframes areaIn{0%,59%{opacity:0}72%,91%{opacity:.14}100%{opacity:0}}
      @keyframes endDot{0%,73%{opacity:0;transform:scale(.5)}80%,88%{opacity:1;transform:scale(1)}91%{opacity:.85;transform:scale(.86)}100%{opacity:0;transform:scale(.5)}}
      @keyframes tickerIn{0%,61%{opacity:0;transform:translateY(5px) scale(.96)}70%,90%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-3px) scale(.98)}}
    </style>
  </defs>

  <!-- Base -->
  <rect width="437" height="195" rx="18" fill="#4079D1"/>
  <rect x="1" y="1" width="435" height="193" rx="17" stroke="white" stroke-opacity="0.07"/>

  <!-- Header -->
  <g>
    <rect x="18" y="16" width="92" height="26" rx="10" fill="#111111" fill-opacity="0.20"/>
    <circle class="liveDot" cx="31" cy="29" r="4" fill="#82FF53"/>
    <text x="41" y="33" fill="white" font-size="11" font-weight="750" letter-spacing="0.8">LIVE NOW</text>
    <text x="418" y="33" text-anchor="end" fill="white" fill-opacity="0.54" font-size="11" font-weight="600">MARKET</text>
  </g>

  <!-- Question -->
  <text x="18" y="65" fill="white" font-size="17" font-weight="760" letter-spacing="-0.25">Will Tinubu win the next election</text>

  <!-- SCENE 1: live stats -->
  <g class="sceneStats">
    <!-- YES card -->
    <g class="yesCard">
      <rect x="18" y="77" width="196" height="78" rx="13" fill="#111111" fill-opacity="0.17" stroke="white" stroke-opacity="0.08"/>
      <g transform="translate(30 89)">
        <rect width="43" height="21" rx="7" fill="#82FF53" fill-opacity="0.16"/>
        <circle cx="10" cy="10.5" r="3" fill="#82FF53"/>
        <text x="18" y="14" fill="#D9FFD0" font-size="10.5" font-weight="800" letter-spacing=".45">YES</text>
      </g>

      <text x="88" y="109" fill="white" font-size="27" font-weight="820" letter-spacing="-1.15">6</text>
      <g clip-path="url(#yesDigitClip)">
        <g class="yesUnitStack">
          <text x="106" y="106" fill="white" font-size="27" font-weight="820" letter-spacing="-1.15">1</text>
          <text x="106" y="134" fill="white" font-size="27" font-weight="820" letter-spacing="-1.15">2</text>
          <text x="106" y="162" fill="white" font-size="27" font-weight="820" letter-spacing="-1.15">3</text>
        </g>
      </g>
      <text x="124" y="109" fill="white" font-size="18" font-weight="760">%</text>
      <g class="yesDelta">
        <rect x="157" y="91" width="45" height="19" rx="7" fill="#82FF53" fill-opacity="0.12"/>
        <path d="M165 103L169 99L173 103" stroke="#82FF53" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="177" y="104" fill="#C8FFB7" font-size="9.5" font-weight="760">+2.0</text>
      </g>
      <rect x="30" y="120" width="172" height="6" rx="3" fill="white" fill-opacity="0.09"/>
      <rect class="yesBarFill" x="30" y="120" width="172" height="6" rx="3" fill="url(#yesBar)"/>
      <text x="30" y="138" fill="white" fill-opacity="0.45" font-size="9.5" font-weight="600">buyers gaining</text>
    </g>

    <!-- NO card -->
    <g>
      <rect x="223" y="77" width="196" height="78" rx="13" fill="#111111" fill-opacity="0.13" stroke="white" stroke-opacity="0.07"/>
      <g transform="translate(235 89)">
        <rect width="42" height="21" rx="7" fill="#FE2C55" fill-opacity="0.14"/>
        <circle cx="10" cy="10.5" r="3" fill="#FE2C55"/>
        <text x="18" y="14" fill="#FFD9E1" font-size="10.5" font-weight="800" letter-spacing=".45">NO</text>
      </g>

      <text x="293" y="109" fill="white" font-size="27" font-weight="820" letter-spacing="-1.15">3</text>
      <g clip-path="url(#noDigitClip)">
        <g class="noUnitStack">
          <text x="311" y="106" fill="white" font-size="27" font-weight="820" letter-spacing="-1.15">9</text>
          <text x="311" y="134" fill="white" font-size="27" font-weight="820" letter-spacing="-1.15">8</text>
          <text x="311" y="162" fill="white" font-size="27" font-weight="820" letter-spacing="-1.15">7</text>
        </g>
      </g>
      <text x="329" y="109" fill="white" font-size="18" font-weight="760">%</text>
      <g class="noDelta">
        <rect x="362" y="91" width="45" height="19" rx="7" fill="#FE2C55" fill-opacity="0.10"/>
        <path d="M370 99L374 103L378 99" stroke="#FF8AA1" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="382" y="104" fill="#FFC0CC" font-size="9.5" font-weight="760">−2.0</text>
      </g>
      <rect x="235" y="120" width="172" height="6" rx="3" fill="white" fill-opacity="0.09"/>
      <rect class="noBarFill" x="235" y="120" width="172" height="6" rx="3" fill="#FE2C55" fill-opacity="0.74"/>
      <text x="235" y="138" fill="white" fill-opacity="0.40" font-size="9.5" font-weight="600">buyers easing</text>
    </g>
  </g>

  <!-- SCENE 2: chart continuation -->
  <g class="sceneChart">
    <!-- summary chips -->
    <g transform="translate(18 76)">
      <rect width="91" height="25" rx="9" fill="#111111" fill-opacity="0.16"/>
      <circle cx="12" cy="12.5" r="3" fill="#82FF53"/>
      <text x="21" y="16" fill="#D9FFD0" font-size="10.5" font-weight="760">YES</text>
      <text x="55" y="16" fill="white" font-size="11" font-weight="800">63%</text>
    </g>
    <g transform="translate(116 76)">
      <rect width="82" height="25" rx="9" fill="#111111" fill-opacity="0.12"/>
      <circle cx="12" cy="12.5" r="3" fill="#FE2C55"/>
      <text x="21" y="16" fill="#FFD9E1" font-size="10.5" font-weight="760">NO</text>
      <text x="50" y="16" fill="white" font-size="11" font-weight="800">37%</text>
    </g>
    <text x="418" y="93" text-anchor="end" fill="white" fill-opacity="0.44" font-size="9.5" font-weight="650">LAST 30 MIN</text>

    <!-- chart surface -->
    <g clip-path="url(#chartClip)">
      <line x1="22" y1="114" x2="415" y2="114" stroke="white" stroke-opacity="0.06"/>
      <line x1="22" y1="138" x2="415" y2="138" stroke="white" stroke-opacity="0.055"/>
      <line x1="92" y1="104" x2="92" y2="163" stroke="white" stroke-opacity="0.035"/>
      <line x1="164" y1="104" x2="164" y2="163" stroke="white" stroke-opacity="0.035"/>
      <line x1="236" y1="104" x2="236" y2="163" stroke="white" stroke-opacity="0.035"/>
      <line x1="308" y1="104" x2="308" y2="163" stroke="white" stroke-opacity="0.035"/>
      <path class="chartArea" d="M22 151 C53 149 66 143 88 144 C113 145 127 132 151 136 C176 140 190 126 214 129 C238 132 248 118 273 120 C298 122 310 109 336 113 C361 117 378 99 414 103 L414 164 L22 164 Z" fill="#82FF53"/>
      <path class="chartLine" d="M22 151 C53 149 66 143 88 144 C113 145 127 132 151 136 C176 140 190 126 214 129 C238 132 248 118 273 120 C298 122 310 109 336 113 C361 117 378 99 414 103" stroke="#B5FFA0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="endDot" cx="414" cy="103" r="4.5" fill="#82FF53" stroke="#4079D1" stroke-width="3"/>
    </g>
    <g class="tickerChip" transform="translate(350 112)">
      <rect width="68" height="24" rx="8" fill="#E9FFE2"/>
      <text x="10" y="16" fill="#214B18" font-size="10" font-weight="820">63%</text>
      <path d="M42 14L47 9L52 14" stroke="#2F7A20" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="57" y="16" fill="#2F7A20" font-size="9" font-weight="780">2</text>
    </g>
    <text x="22" y="178" fill="white" fill-opacity="0.43" font-size="9.2" font-weight="600">Live probability movement</text>
  </g>
</svg>
